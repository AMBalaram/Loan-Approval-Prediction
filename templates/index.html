<!DOCTYPE html>
<html>
<head>
    <title>Loan Approval Prediction</title>
    <link rel="stylesheet" href="static/style.css">

</head>

<body>
    <div class="container">
        <h1>Loan Approval Prediction</h1>

        <form action="/predict" method="POST">

            <label>No of Dependents</label>
            <input type="number" name="no_of_dependents" value="{{ request.form.no_of_dependents }}">

            <label>Education (0 = Graduate, 1 = Not Graduate)</label>
            <input type="number" name="education" value="{{ request.form.education }}">

            <label>Self Employed (0 = No, 1 = Yes)</label>
            <input type="number" name="self_employed" value="{{ request.form.self_employed }}">

            <label>Annual Income</label>
            <input type="number" name="income_annum" value="{{ request.form.income_annum }}">

            <label>Loan Amount</label>
            <input type="number" name="loan_amount" value="{{ request.form.loan_amount }}">

            <label>Loan Term</label>
            <input type="number" name="loan_term" value="{{ request.form.loan_term }}">

            <label>CIBIL Score</label>
            <input type="number" name="cibil_score" value="{{ request.form.cibil_score }}">

            <label>Assets</label>
            <input type="number" name="Assets" value="{{ request.form.Assets }}">

            <button type="submit">Predict</button>
        </form>

        <div class="result">
            Loan Status: {{ prediction_text }}
        </div>
    </div>
</body>
</html>
